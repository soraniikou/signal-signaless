<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>シグナルとシグナレス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#050914;
    --sky-bottom:#0d1a35;
    --ink:#d3daea;
    --whisper:#6d7893;
    --lamp:#c8402f;
    --blue:#5aa0f5;
    --green:#4fd6a0;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--sky-top);
    overflow:hidden;
    font-family:'Zen Kaku Gothic New',sans-serif;
    color:var(--ink);
    user-select:none;
    touch-action:none;
  }
  #stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }

  #text-layer{
    position:absolute; inset:0; z-index:5;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end;
    padding:0 8vw 7vh;
    pointer-events:none;
  }
  #line{
    font-family:'Shippori Mincho',serif;
    font-size:clamp(16px,2.5vmin,22px);
    line-height:2.1; text-align:center; letter-spacing:.09em;
    max-width:600px; margin:0;
    opacity:0; transition:opacity 1.8s ease;
    text-shadow:0 2px 14px rgba(3,6,16,.95);
  }
  #line.show{ opacity:1; }
  #hint{
    font-weight:300;
    font-size:clamp(10px,1.5vmin,12px);
    letter-spacing:.28em; color:var(--whisper);
    margin:22px 0 0; opacity:0;
    transition:opacity 1.6s ease;
    text-shadow:0 2px 14px rgba(3,6,16,.95);
  }
  #hint.show{ opacity:1; animation:pulse 3.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.45} 50%{opacity:.95} }

  #title{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:6; opacity:0; transition:opacity 2.2s ease;
  }
  #title.show{ opacity:1; }
  #title h1{
    font-family:'Shippori Mincho',serif;
    font-weight:500;
    font-size:clamp(22px,4.2vmin,34px);
    letter-spacing:.34em; margin:0 0 0 .34em;
    color:#e4eaf8;
    text-shadow:0 2px 20px rgba(3,6,16,.95);
  }
  #title p{
    font-weight:300; font-size:clamp(10px,1.5vmin,12px);
    letter-spacing:.3em; color:var(--whisper); margin:20px 0 0 .3em;
  }

  #replay{
    position:absolute; bottom:5vh; left:50%; transform:translateX(-50%);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300;
    font-size:12px; letter-spacing:.2em;
    background:transparent; color:var(--ink);
    border:1px solid rgba(211,218,234,.3); border-radius:999px;
    padding:9px 26px; cursor:pointer; z-index:8;
    opacity:0; pointer-events:none; transition:opacity 1.6s ease,background .4s ease;
  }
  #replay.show{ opacity:1; pointer-events:auto; }
  #replay:hover{ background:rgba(211,218,234,.08); }

  #next{
    position:absolute; bottom:5vh; left:50%; transform:translateX(-50%);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300;
    font-size:12px; letter-spacing:.22em;
    background:transparent; color:rgba(255,218,238,1.0);
    border:1px solid rgba(255,168,218,.65); border-radius:999px;
    padding:9px 26px; cursor:pointer; z-index:8;
    opacity:0; pointer-events:none; transition:opacity 1.6s ease,background .4s ease;
    text-shadow:0 0 14px rgba(255,150,215,.65);
  }
  #next.show{ opacity:1; pointer-events:auto; }
  #next:hover{ background:rgba(255,150,210,.12); }

  /* スマホ：nextボタンを信号機の下に移動 / tapボタンを0.7倍に縮小 */
  @media (pointer:coarse) and (max-width:768px){
    #next{ bottom:auto; top:79vh; }
    #tap{ font-size:clamp(10px,1.68vmin,14px); padding:10px 31px; }
  }
  #tap{
    position:absolute; top:58%; left:50%; transform:translateX(-50%);
    font-family:'Zen Kaku Gothic New',sans-serif; font-weight:300;
    font-size:clamp(15px,2.4vmin,20px); letter-spacing:.35em;
    background:transparent; color:rgba(255,200,230,.92);
    border:1px solid rgba(255,160,210,.55); border-radius:999px;
    padding:14px 44px; cursor:pointer; z-index:9;
    opacity:0; pointer-events:none;
    transition:opacity 1.8s ease,background .4s ease;
  }
  #tap.show{ opacity:1; pointer-events:auto; animation:tapGlow 2.8s ease-in-out infinite; }
  #tap:hover{ background:rgba(255,150,210,.14); }
  @keyframes tapGlow{
    0%,100%{ box-shadow:0 0 10px rgba(255,140,210,.18); }
    50%{ box-shadow:0 0 32px rgba(255,140,210,.60); }
  }

  #input-area{
    position:absolute; inset:0; z-index:7;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 1.8s ease;
    padding:0 6vw;
  }
  #input-area.show{ opacity:1; pointer-events:auto; }
  #input-area.has-messages #input-label{ display:none; }
  #msg-display{
    width:min(440px,80vw); max-height:28vh;
    overflow-y:auto; margin-bottom:18px;
    display:flex; flex-direction:column; gap:8px;
    scrollbar-width:thin; scrollbar-color:rgba(0,200,225,.25) transparent;
  }
  .msg-bubble{
    background:rgba(0,35,55,0.60);
    border:1px solid rgba(0,200,225,.28); border-radius:14px;
    padding:9px 16px;
    color:rgba(210,250,255,.95);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:clamp(13px,1.9vmin,15px); font-weight:300;
    text-align:left; word-break:break-word;
    text-shadow:0 0 10px rgba(0,200,225,.35);
    animation:bubblePop .4s ease;
  }
  @keyframes bubblePop{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  #input-label{
    font-family:'Shippori Mincho',serif;
    font-size:clamp(14px,2.4vmin,20px); letter-spacing:.08em;
    color:rgba(220,250,255,1.0); margin:0 0 18px;
    text-shadow:0 0 18px rgba(0,200,225,.70), 0 2px 8px rgba(0,0,0,.85);
    text-align:center;
    background:rgba(0,18,35,0.55);
    padding:10px 22px; border-radius:6px;
  }
  #input-row{
    display:flex; gap:10px; align-items:center; width:min(440px,80vw);
  }
  #signal-input{
    flex:1;
    background:rgba(0,22,42,.62);
    border:1px solid rgba(0,200,225,.42); border-radius:6px;
    color:rgba(200,248,255,.95);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-weight:300; font-size:clamp(14px,2vmin,16px);
    letter-spacing:.04em;
    padding:13px 18px;
    outline:none; transition:border-color .4s,box-shadow .4s;
  }
  #signal-input:focus{
    border-color:rgba(0,215,230,.72);
    box-shadow:0 0 20px rgba(0,200,225,.32);
  }
  #signal-input::placeholder{ color:rgba(100,200,220,.45); }
  #send-btn{
    background:rgba(0,180,210,.18);
    border:1px solid rgba(0,200,225,.40); border-radius:6px;
    color:rgba(180,245,255,.95); font-size:18px;
    padding:12px 18px; cursor:pointer;
    transition:background .3s,box-shadow .3s; flex-shrink:0;
  }
  #send-btn:hover{ background:rgba(0,200,225,.28); box-shadow:0 0 14px rgba(0,200,225,.35); }

  @media (prefers-reduced-motion: reduce){
    #hint.show{ animation:none; opacity:.8; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="scene"></canvas>

  <div id="title"></div>

  <div id="text-layer">
    <p id="line"></p>
    <p id="hint"></p>
  </div>

  <button id="replay">back</button>
  <button id="next">next</button>
  <button id="tap">tap</button>

  <div id="input-area">
    <div id="msg-display"></div>
    <p id="input-label">Send a small signal — starting with you</p>
    <div id="input-row">
      <input type="text" id="signal-input" autocomplete="off" spellcheck="false" placeholder="type your signal…">
      <button id="send-btn">→</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ canvas ============ */
const skyC = document.getElementById('sky');
const sctx = skyC.getContext('2d');
const objC = document.getElementById('scene');
const ctx  = objC.getContext('2d');
const stage = document.getElementById('stage');
const lineEl = document.getElementById('line');
const hintEl = document.getElementById('hint');
const titleEl = document.getElementById('title');
const replayBtn = document.getElementById('replay');
const nextBtn   = document.getElementById('next');
const tapBtn    = document.getElementById('tap');
const inputAreaEl = document.getElementById('input-area');
const signalInput = document.getElementById('signal-input');
const msgDisplay  = document.getElementById('msg-display');
const sendBtn     = document.getElementById('send-btn');

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=0, H=0, DPR=1, horizon=0, poleH=0;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  [skyC,objC].forEach(c=>{
    c.width = W*DPR; c.height = H*DPR;
    c.style.width = W+'px'; c.style.height = H+'px';
  });
  sctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  horizon = H*0.74;
  poleH = Math.min(H*0.34, W*0.42);
  buildStars();
}
window.addEventListener('resize', resize);

/* ============ stars ============ */
let stars=[];
function buildStars(){
  stars=[];
  const n = Math.round((W*H)/9000);
  for(let i=0;i<Math.min(n,180);i++){
    stars.push({
      x:Math.random()*W,
      y:Math.random()*horizon*0.95,
      r:Math.random()*1.2+.25,
      a:Math.random()*.55+.18,
      tw:Math.random()*Math.PI*2,
      sp:Math.random()*.9+.25
    });
  }
}

/* state that dims the sky during anger */
let starDim = 0;   // 0..1
let shake = 0;     // px

function drawSky(t){
  sctx.clearRect(0,0,W,H);
  const g = sctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,'#050914');
  g.addColorStop(1,'#0d1a35');
  sctx.fillStyle=g; sctx.fillRect(0,0,W,horizon+2);

  for(const s of stars){
    const tw = reduced ? 0 : Math.sin(t*s.sp + s.tw)*0.18;
    const a = Math.max(0,(s.a+tw)*(1-starDim*0.9));
    sctx.beginPath();
    sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    sctx.fillStyle = 'rgba(226,233,250,'+a+')';
    sctx.fill();
  }

  /* snow hills — flat layered shapes, after the picture book */
  const hills = [
    {y:horizon-H*0.055, amp:H*0.030, col:'#1d3f66', ph:0.0, f:1.4},
    {y:horizon-H*0.012, amp:H*0.022, col:'#2c5f8d', ph:1.7, f:2.1},
    {y:horizon+H*0.030, amp:H*0.016, col:'#4d88b4', ph:3.4, f:2.8}
  ];
  for(const h of hills){
    sctx.beginPath();
    sctx.moveTo(0,H);
    for(let x=0;x<=W;x+=6){
      const u = x/W;
      const y = h.y + Math.sin(u*Math.PI*h.f + h.ph)*h.amp
                    + Math.sin(u*Math.PI*h.f*2.6 + h.ph*1.9)*h.amp*0.35;
      sctx.lineTo(x,y);
    }
    sctx.lineTo(W,H); sctx.closePath();
    sctx.fillStyle=h.col; sctx.fill();
  }
}

/* ============ poles ============ */
/* signal: 本線の金属＋電気式（黒と白）  signaless: 軽便の木製＋ランプ式（黄土） */
const signal    = { xr:0.29, offset:0, lamp:0, shake:0 };
const signaless = { xr:0.71, offset:0, lamp:0, shake:0 };

function poleGeom(p){
  const x = W*p.xr + p.offset;
  const base = horizon + H*0.035;
  const top = base - poleH;
  const w = Math.max(7, poleH*0.052);
  return {x, base, top, w};
}
function lampPos(p){
  const g = poleGeom(p);
  return {x:g.x + g.w*2.6, y:g.top + poleH*0.30};
}

function drawPole(p, opts){
  const g = poleGeom(p);
  const {x, base, top, w} = g;
  const armW = poleH*0.40, armH = Math.max(6, poleH*0.062);
  const armY = top + poleH*0.30;

  ctx.save();

  /* post */
  if(opts.metal){
    ctx.fillStyle = '#151a24';
    ctx.fillRect(x-w/2, top, w, base-top);
    ctx.fillStyle = '#e9eef7';
    for(let i=0;i<3;i++){
      const seg = (base-top)/6;
      ctx.fillRect(x-w/2, top + seg*(i*2+1.6), w, seg*0.9);
    }
  } else {
    ctx.fillStyle = '#c79a4e';
    ctx.fillRect(x-w/2, top, w, base-top);
    ctx.fillStyle = '#8a6329';
    ctx.fillRect(x-w/2, base-poleH*0.10, w, poleH*0.10);
  }

  /* cap */
  ctx.fillStyle = '#12161f';
  ctx.beginPath();
  ctx.moveTo(x, top - poleH*0.075);
  ctx.lineTo(x + w*1.9, top + poleH*0.005);
  ctx.lineTo(x - w*1.9, top + poleH*0.005);
  ctx.closePath(); ctx.fill();

  /* arm — the semaphore blade */
  const tilt = opts.metal ? -0.10 : 0.10;
  ctx.save();
  ctx.translate(x, armY);
  ctx.rotate(tilt);
  if(opts.metal){
    ctx.fillStyle='#c8402f'; ctx.fillRect(-armW, -armH/2, armW, armH);
    ctx.fillStyle='#f2f5fb'; ctx.fillRect(-armW*0.30, -armH/2, armW*0.14, armH);
  } else {
    ctx.fillStyle='#f2f5fb'; ctx.fillRect(0, -armH/2, armW, armH);
    ctx.fillStyle='#12161f'; ctx.fillRect(armW*0.24, -armH/2, armW*0.13, armH);
  }
  ctx.restore();

  /* lamp housing + light */
  const lp = lampPos(p);
  const lx = opts.metal ? lp.x : x - w*2.6;
  const lr = Math.max(6, poleH*0.055);
  ctx.beginPath();
  ctx.arc(lx, lp.y, lr*1.55, 0, Math.PI*2);
  ctx.fillStyle = '#12161f'; ctx.fill();

  const lit = p.lamp;
  ctx.beginPath();
  ctx.arc(lx, lp.y, lr, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(200,64,47,'+(0.30 + lit*0.70)+')';
  if(lit>0.02){ ctx.shadowColor='rgba(200,64,47,'+(lit*0.9)+')'; ctx.shadowBlur=26*lit; }
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.restore();

  return {lx, ly:lp.y};
}

/* ============ beams ============ */
let beamA = 0, beamB = 0;         // 0..1
let bloom = 0;                    // 0..1
let meet = {x:0,y:0};

function drawBeams(){
  meet = {x:W*0.5, y:horizon - poleH*1.15};
  const gs = poleGeom(signal), gl = poleGeom(signaless);
  const a = {x:gs.x + gs.w*2.6, y:gs.top + poleH*0.30};
  const b = {x:gl.x - gl.w*2.6, y:gl.top + poleH*0.30};

  drawBeam(a, meet, beamA, '90,160,245');
  drawBeam(b, meet, beamB, '79,214,160');

  if(bloom>0){
    const r = poleH*(0.10 + bloom*0.85);
    const g = ctx.createRadialGradient(meet.x,meet.y,0,meet.x,meet.y,r);
    const fade = 1-Math.max(0,(bloom-0.6)/0.4);
    g.addColorStop(0,'rgba(255,255,255,'+(0.95*fade)+')');
    g.addColorStop(0.35,'rgba(150,230,220,'+(0.45*fade)+')');
    g.addColorStop(1,'rgba(120,200,255,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(meet.x,meet.y,r,0,Math.PI*2); ctx.fill();
  }
}
function drawBeam(from, to, prog, rgb){
  if(prog<=0.002) return;
  const ex = from.x + (to.x-from.x)*prog;
  const ey = from.y + (to.y-from.y)*prog;
  const grad = ctx.createLinearGradient(from.x,from.y,ex,ey);
  grad.addColorStop(0,'rgba('+rgb+',0.05)');
  grad.addColorStop(0.5,'rgba('+rgb+',0.55)');
  grad.addColorStop(1,'rgba('+rgb+',0.95)');
  ctx.save();
  ctx.lineCap='round';
  ctx.strokeStyle=grad;
  ctx.shadowColor='rgba('+rgb+',0.75)'; ctx.shadowBlur=18;
  ctx.lineWidth=Math.max(2, poleH*0.022);
  ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.lineWidth=Math.max(1, poleH*0.007);
  ctx.strokeStyle='rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.moveTo(from.x,from.y); ctx.lineTo(ex,ey); ctx.stroke();
  ctx.restore();
}

/* ============ love ripples & soap bubbles ============ */
function getLampPos2(p){
  const g = poleGeom(p);
  const isSignal = (p === signal);
  return { x: isSignal ? g.x + g.w*2.6 : g.x - g.w*2.6, y: g.top + poleH*0.30 };
}

let ripples = [];
let loveBubbles = [];

function spawnRipple(p){
  const lp = getLampPos2(p);
  ripples.push({
    x: lp.x, y: lp.y,
    r: poleH*0.04,
    maxR: poleH*(0.44 + Math.random()*0.56),
    speed: poleH*0.007 + Math.random()*poleH*0.005
  });
}

function drawRipples(){
  ripples = ripples.filter(r=>{
    r.r += r.speed;
    const progress = r.r / r.maxR;
    if(progress >= 1) return false;
    const alpha = (1 - progress) * 0.55;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(255,150,210,${alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    return true;
  });
}

function spawnBubble(p, letter){
  const lp = getLampPos2(p);
  const isSignal = (p === signal);
  const sizeScale = (letter && letter.length > 2) ? 3.4 : 1.0;
  const r = poleH*(0.036 + Math.random()*0.056) * sizeScale;
  const distToCenter = Math.abs(W*0.5 - lp.x);
  const targetFrames = 210 + Math.floor(Math.random()*80);
  const vxSpeed = distToCenter / targetFrames;
  loveBubbles.push({
    x: lp.x,
    y: lp.y + (Math.random()-0.5)*poleH*0.10,
    r,
    vx: (isSignal ? 1 : -1) * vxSpeed,
    vy: -(poleH*0.0007 + Math.random()*poleH*0.0008),
    wobble: Math.random()*Math.PI*2,
    wobbleSpeed: 0.035 + Math.random()*0.03,
    hue: 310 + Math.random()*60,
    letter: letter || null,
    life: 0,
    maxLife: targetFrames + 70
  });
}

function drawBubbles(){
  loveBubbles = loveBubbles.filter(b=>{
    b.life++;
    b.wobble += b.wobbleSpeed;
    b.x += b.vx + Math.sin(b.wobble)*0.45;
    b.y += b.vy;
    b.vy += 0.0025;
    const progress = b.life / b.maxLife;
    const fadeIn  = Math.min(1, b.life / 22);
    const fadeOut = progress > 0.72 ? Math.max(0, 1-(progress-0.72)/0.28) : 1;
    const alpha   = fadeIn * fadeOut;
    if(alpha <= 0) return false;
    ctx.save();
    const grd = ctx.createRadialGradient(
      b.x - b.r*0.32, b.y - b.r*0.32, b.r*0.05,
      b.x, b.y, b.r
    );
    grd.addColorStop(0,   `hsla(${b.hue},100%,96%,${alpha*0.38})`);
    grd.addColorStop(0.5, `hsla(${b.hue+30},90%,80%,${alpha*0.14})`);
    grd.addColorStop(1,   `hsla(${b.hue-20},100%,70%,0)`);
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.strokeStyle = `hsla(${b.hue},100%,88%,${alpha*0.88})`;
    ctx.lineWidth = 1.3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x - b.r*0.28, b.y - b.r*0.30, b.r*0.19, 0, Math.PI*2);
    ctx.fillStyle = `rgba(255,255,255,${alpha*0.68})`;
    ctx.fill();
    if(b.letter){
      const isWord = b.letter.length > 2;
      const fs = isWord ? Math.max(9, b.r*0.46) : Math.max(13, b.r*0.92);
      ctx.font = `400 ${fs}px 'Shippori Mincho', Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const tg = ctx.createLinearGradient(b.x - b.r, b.y, b.x + b.r, b.y);
      tg.addColorStop(0,   `hsla(${b.hue-25},100%,92%,${alpha})`);
      tg.addColorStop(0.5, `hsla(${b.hue+40},100%,99%,${alpha})`);
      tg.addColorStop(1,   `hsla(${b.hue+10},100%,88%,${alpha})`);
      ctx.shadowColor = `hsla(${b.hue},100%,80%,${alpha*0.9})`;
      ctx.shadowBlur  = b.r * 0.55;
      ctx.fillStyle = tg;
      ctx.fillText(b.letter, b.x, b.y);
      ctx.shadowBlur = 0;
    }
    ctx.restore();
    return b.life < b.maxLife;
  });
}

/* ============ sunflower gear ============ */
function gearGeom(){
  const cx = W * 0.5;
  const cy = horizon - poleH * 0.30;
  const r  = Math.max(W * 0.245, poleH * 0.68) * 0.7;
  return { cx, cy, r };
}

function drawGearBack(){
  const { cx, cy, r } = gearGeom();
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(6,12,30,0.52)';
  ctx.fill();
  ctx.restore();
}

function drawGearFront(t){
  const { cx, cy, r } = gearGeom();
  const angle      = t * 0.043;
  const petalCount = 18;
  const petalLen   = r * 0.40;
  const petalW     = r * 0.125;
  const spokeCount = 8;
  const hubR       = r * 0.11;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  /* sunflower petals — hidden */

  /* outer ring */
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(235,215,140,0.18)';
  ctx.lineWidth = Math.max(1.2, r * 0.018);
  ctx.stroke();

  /* spokes */
  ctx.strokeStyle = 'rgba(225,205,120,0.09)';
  ctx.lineWidth = Math.max(0.8, r * 0.009);
  for(let i = 0; i < spokeCount; i++){
    const a = (i / spokeCount) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a)*hubR*1.6,  Math.sin(a)*hubR*1.6);
    ctx.lineTo(Math.cos(a)*r*0.91,    Math.sin(a)*r*0.91);
    ctx.stroke();
  }

  /* sunflower centre hub */
  const hg = ctx.createRadialGradient(0, 0, 0, 0, 0, hubR*2.6);
  hg.addColorStop(0,   'rgba(100,80,30,0.22)');
  hg.addColorStop(0.55,'rgba(80,60,20,0.13)');
  hg.addColorStop(1,   'rgba(60,45,10,0.04)');
  ctx.beginPath();
  ctx.arc(0, 0, hubR*2.6, 0, Math.PI*2);
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,200,110,0.13)';
  ctx.lineWidth = 1.0;
  ctx.stroke();

  ctx.restore();
}

/* ============ gear aurora ============ */
function drawGearAurora(t){
  const { cx, cy, r } = gearGeom();

  /* scaled lamp positions (poles are drawn at 0.6x inside gear) */
  const lpL = getLampPos2(signal);
  const lpR = getLampPos2(signaless);
  const lx  = cx + (lpL.x - cx) * 0.6;
  const ly  = cy + (lpL.y - cy) * 0.6;
  const rx  = cx + (lpR.x - cx) * 0.6;
  const ry  = cy + (lpR.y - cy) * 0.6;

  ctx.save();

  /* clip to inner wheel */
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.93, 0, Math.PI*2);
  ctx.clip();

  ctx.globalCompositeOperation = 'screen';

  const T  = t * 0.65;
  const w1 = Math.sin(T * 1.05)       * 0.28 + 0.72;
  const w2 = Math.sin(T * 0.80 + 1.3) * 0.28 + 0.72;
  const w3 = Math.sin(T * 1.25 + 2.6) * 0.22 + 0.78;

  const aR = r * 0.90;

  /* turquoise bloom from signal (left) */
  const g1 = ctx.createRadialGradient(lx, ly, 0, cx + r*0.04*Math.sin(T*0.9), cy, aR);
  g1.addColorStop(0,    `rgba(0,218,225,${0.62*w1})`);
  g1.addColorStop(0.28, `rgba(22,185,195,${0.40*w1})`);
  g1.addColorStop(0.58, `rgba(0,160,185,${0.18*w1})`);
  g1.addColorStop(1,    'rgba(0,90,140,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  /* emerald bloom from signaless (right) */
  const g2 = ctx.createRadialGradient(rx, ry, 0, cx - r*0.04*Math.sin(T*0.9), cy, aR);
  g2.addColorStop(0,    `rgba(0,210,130,${0.62*w2})`);
  g2.addColorStop(0.28, `rgba(18,188,110,${0.40*w2})`);
  g2.addColorStop(0.58, `rgba(0,162,85,${0.18*w2})`);
  g2.addColorStop(1,    'rgba(0,110,55,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  /* centre merge glow */
  const mcy = cy + Math.sin(T*0.55)*r*0.12;
  const g3 = ctx.createRadialGradient(cx, mcy, 0, cx, mcy, r*0.55);
  g3.addColorStop(0,    `rgba(120,255,230,${0.50*w3})`);
  g3.addColorStop(0.35, `rgba(40,215,185,${0.30*w3})`);
  g3.addColorStop(1,    'rgba(0,145,140,0)');
  ctx.fillStyle = g3;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  /* aurora bands — horizontal shimmer streaks */
  const bands = [
    { speed:0.40, phase:0.0,  hue:'0,218,200', wScale:0.88 },
    { speed:0.28, phase:1.55, hue:'0,195,105', wScale:0.78 },
    { speed:0.52, phase:3.10, hue:'60,240,210',wScale:0.65 },
  ];
  for(const b of bands){
    const ph   = T * b.speed + b.phase;
    const by   = cy + Math.sin(ph) * r * 0.38 + Math.sin(ph*1.9)*r*0.10;
    const bx   = cx + Math.cos(ph * 0.6) * r * 0.18;
    const bw   = r * b.wScale;
    const bh   = r * (0.10 + Math.sin(ph*1.4)*0.04);
    const wv   = Math.sin(T*1.1 + b.phase)*0.22 + 0.78;
    const sg   = ctx.createLinearGradient(bx-bw, by, bx+bw, by);
    sg.addColorStop(0,    'rgba(0,0,0,0)');
    sg.addColorStop(0.25, `rgba(${b.hue},${0.22*wv})`);
    sg.addColorStop(0.50, `rgba(${b.hue},${0.42*wv})`);
    sg.addColorStop(0.75, `rgba(${b.hue},${0.22*wv})`);
    sg.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(bx-bw, by-bh, bw*2, bh*2);
  }

  /* glossy specular sheen (white highlight arc) */
  const shineY = cy - r*0.52 + Math.sin(T*0.4)*r*0.06;
  const sg2 = ctx.createRadialGradient(cx, shineY, 0, cx, shineY, r*0.46);
  sg2.addColorStop(0,   `rgba(200,255,250,${0.28*w3})`);
  sg2.addColorStop(0.5, `rgba(140,240,230,${0.12*w3})`);
  sg2.addColorStop(1,   'rgba(80,200,210,0)');
  ctx.fillStyle = sg2;
  ctx.fillRect(cx-r, cy-r, r*2, r*2);

  ctx.restore();
}

/* ============ light wheel ============ */
function drawLightWheel(t, fade){
  if(fade <= 0) return;
  const { cx, cy, r } = gearGeom();

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  /* complete glowing rings — rMul, rgb, lineWidthMul, blurMul, pulseSeed */
  const rings = [
    { rMul:0.38, rgb:'0,210,225',  lw:0.048, blur:0.14, seed:0.0 },
    { rMul:0.62, rgb:'0,195,112',  lw:0.038, blur:0.11, seed:1.3 },
    { rMul:0.84, rgb:'55,228,212', lw:0.034, blur:0.10, seed:2.6 },
    { rMul:1.02, rgb:'0,205,132',  lw:0.030, blur:0.09, seed:0.8 },
    { rMul:1.32, rgb:'0,212,228',  lw:0.024, blur:0.08, seed:2.1 },
  ];

  for(const ring of rings){
    const ringR  = r * ring.rMul;
    const pulse  = 0.68 + Math.sin(t * 0.55 + ring.seed) * 0.32;
    const alpha  = 0.28 * fade * pulse;
    const lw     = r * ring.lw * fade;
    const blurPx = r * ring.blur;

    ctx.save();
    ctx.filter      = `blur(${blurPx}px)`;
    ctx.lineWidth   = lw;
    ctx.strokeStyle = `rgba(${ring.rgb},${alpha})`;
    ctx.shadowColor = `rgba(${ring.rgb},0.85)`;
    ctx.shadowBlur  = lw * 4;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  /* rotating spokes */
  const spokeN = 12;
  for(let i = 0; i < spokeN; i++){
    const a    = (i / spokeN) * Math.PI*2 + t * 0.18;
    const len  = r * (0.52 + Math.sin(t*0.48 + i*0.52) * 0.20);
    const col  = i%2===0 ? '0,215,228' : '0,205,118';
    const puls = 0.60 + Math.sin(t*0.75 + i*0.42) * 0.40;

    ctx.save();
    ctx.filter = `blur(${r*0.022}px)`;
    const sg = ctx.createLinearGradient(
      cx, cy, cx + Math.cos(a)*r*1.4, cy + Math.sin(a)*r*1.4
    );
    sg.addColorStop(0,    `rgba(${col},0)`);
    sg.addColorStop(0.18, `rgba(${col},${0.18*fade*puls})`);
    sg.addColorStop(0.55, `rgba(${col},${0.32*fade*puls})`);
    sg.addColorStop(1,    `rgba(${col},0)`);
    ctx.strokeStyle = sg;
    ctx.lineWidth   = Math.max(0.8, r*0.010) * fade;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a)*r*0.06, cy + Math.sin(a)*r*0.06);
    ctx.lineTo(cx + Math.cos(a)*len,    cy + Math.sin(a)*len);
    ctx.stroke();
    ctx.restore();
  }

  /* central soft pulse */
  const pR = r * (0.18 + Math.sin(t*1.1)*0.05);
  ctx.save();
  ctx.filter = `blur(${r*0.06}px)`;
  const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, pR);
  cg.addColorStop(0,   `rgba(150,255,250,${0.38*fade})`);
  cg.addColorStop(0.5, `rgba(30,210,200,${0.18*fade})`);
  cg.addColorStop(1,   'rgba(0,175,185,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(cx, cy, pR, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.restore();
}

/* ============ 電信柱のささやき ============ */
const rumors = [
  'みぶんがちがう','本線と軽便','東京へ知らせました',
  'あの微笑みは なんだったのか','ゆるされません','分をわきまえよ'
];
let whispers = [];
function spawnWhisper(){
  whispers.push({
    text: rumors[Math.floor(Math.random()*rumors.length)],
    x: Math.random()<0.5 ? -W*0.35 : W*1.05,
    y: horizon*(0.18+Math.random()*0.62),
    v: (Math.random()*0.5+0.35)*(Math.random()<0.5?1:-1),
    a: 0, life:0
  });
  if(whispers[whispers.length-1].x<0) whispers[whispers.length-1].v = Math.abs(whispers[whispers.length-1].v);
  else whispers[whispers.length-1].v = -Math.abs(whispers[whispers.length-1].v);
}
function drawWhispers(){
  ctx.save();
  ctx.font = '300 '+Math.max(11,Math.round(H*0.017))+"px 'Zen Kaku Gothic New', sans-serif";
  ctx.textAlign='center';
  whispers = whispers.filter(w=>{
    w.life++; w.x += w.v;
    w.a = w.life<40 ? w.a+0.02 : w.a-0.004;
    if(w.a<=0) return false;
    ctx.fillStyle='rgba(190,200,222,'+Math.max(0,Math.min(0.5,w.a))+')';
    ctx.fillText(w.text, w.x, w.y);
    return w.x>-W*0.5 && w.x<W*1.5;
  });
  ctx.restore();
}

/* ============ loop ============ */
let last=performance.now();
function loop(now){
  const dt = Math.min(50, now-last)/1000; last=now;
  const t = now/1000;

  /* per-scene updates */
  if(scene==='anger'){
    angerPeak = Math.max(0, angerPeak - dt*0.22);
    starDim = Math.min(0.9, angerPeak*1.0);
    signal.lamp = angerPeak;
    signaless.lamp = angerPeak*0.85;
    if(Math.random()<0.012) spawnWhisper();
  } else if(scene==='stillness'){
    angerPeak = Math.max(0, angerPeak - dt*0.5);
    starDim = Math.max(0, starDim - dt*0.35);
    signal.lamp = Math.max(0, signal.lamp - dt*0.5);
    signaless.lamp = Math.max(0, signaless.lamp - dt*0.5);
    if(now - sceneStart > 5200) goLight();
  } else if(scene==='light'){
    const rate = reduced ? 0.55 : 0.30;
    if(holding){ beamA = Math.min(1, beamA + dt*rate); beamB = Math.min(1, beamB + dt*rate); }
    else { beamA = Math.max(0, beamA - dt*0.16); beamB = Math.max(0, beamB - dt*0.16); }
    starDim = Math.max(0, starDim - dt*0.3);
    if(beamA>=1 && beamB>=1) goMerge();
  } else if(scene==='merge' || scene==='end'){
    bloom = Math.min(1, bloom + dt*0.16);
    beamA = Math.max(0, beamA - dt*0.10);
    beamB = Math.max(0, beamB - dt*0.10);
  } else if(scene==='gear'){
    if(poleFade > 0){
      poleFade = Math.max(0, poleFade - dt/5.0);
    } else if(!lightWheelFired){
      lightWheelFired = true;
      setTimeout(()=>{ if(scene==='gear') nextBtn.classList.add('show'); }, 1800);
    }
  }

  shake = Math.max(0, shake - dt*22);
  signal.shake = Math.max(0, signal.shake - dt*26);

  /* spawn love ripples & bubbles (not during anger) */
  if(scene==='distance'||scene==='greek1'||scene==='greek2'){
    if(Math.random()<0.0025) spawnRipple(signal);
    if(Math.random()<0.0025) spawnRipple(signaless);
  }
  if(scene==='distance'){
    if(Math.random()<0.0045) spawnBubble(signal, null);
    if(Math.random()<0.0045) spawnBubble(signaless, null);
  } else if(scene==='greek1'){
    if(Math.random()<0.0045) spawnBubble(signal, 'α');
    if(Math.random()<0.0045) spawnBubble(signaless, 'ω');
  } else if(scene==='greek2'){
    if(Math.random()<0.0035) spawnBubble(signal, 'ἀγάπη');
    if(Math.random()<0.0035) spawnBubble(signaless, 'πρᾶγμα');
  }

  /* draw */
  drawSky(t);
  ctx.clearRect(0,0,W,H);

  const sx = shake ? (Math.random()-0.5)*shake : 0;
  const sy = shake ? (Math.random()-0.5)*shake*0.5 : 0;
  ctx.save();
  ctx.translate(sx, sy);

  if(scene==='light'||scene==='merge'||scene==='end') drawBeams();

  const inGear = scene==='gear'||scene==='input';
  if(inGear) drawGearBack();
  if(inGear) drawGearAurora(t);

  if(inGear){
    const { cx, cy } = gearGeom();
    ctx.save();
    ctx.globalAlpha = poleFade;
    ctx.translate(cx, cy);
    ctx.scale(0.6, 0.6);
    ctx.translate(-cx, -cy);
  }
  const jitter = signal.shake ? (Math.random()-0.5)*signal.shake : 0;
  const keep = signal.offset;
  signal.offset = keep + jitter;
  drawPole(signal, {metal:true});
  signal.offset = keep;
  drawPole(signaless, {metal:false});
  if(inGear) ctx.restore();

  if(inGear) drawGearFront(t);

  const lwFade = Math.min(1, Math.max(0, (1-poleFade)*1.5));
  if(inGear && lwFade > 0) drawLightWheel(t, lwFade);

  drawRipples();
  drawBubbles();

  if(scene==='anger'||scene==='stillness') drawWhispers();

  ctx.restore();
  requestAnimationFrame(loop);
}

resize();
goTitle();
requestAnimationFrame(loop);

})();
</script>
</body>
